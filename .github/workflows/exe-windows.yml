name: Exécutable Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer
        run: python -m pip install -e ".[exe]"
      - name: Construire AutoCorrectNEPSY.exe
        run: python packaging/build.py
      - name: Tester l'exécutable
        shell: pwsh
        run: |
          python packaging/sample_scan.py exemple.pdf
          $p = Start-Process -FilePath dist\AutoCorrectNEPSY.exe -ArgumentList 'corriger','exemple.pdf','-o','sortie' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "correction en ligne de commande : code $($p.ExitCode)" }
          if (-not (Test-Path sortie\cotation.csv)) { throw "cotation.csv absent" }
          Get-Content sortie\cotation.csv
          $p = Start-Process -FilePath dist\AutoCorrectNEPSY.exe -ArgumentList '--test-interface','exemple.pdf' -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-Content test-interface-erreur.txt -ErrorAction SilentlyContinue
            throw "interface : code $($p.ExitCode)"
          }
          "Taille : {0:N0} Mo" -f ((Get-Item dist\AutoCorrectNEPSY.exe).Length / 1MB)
      - uses: actions/upload-artifact@v4
        with:
          name: AutoCorrectNEPSY-windows
          path: dist/AutoCorrectNEPSY.exe
      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/AutoCorrectNEPSY.exe
          --title "AutoCorrect NEPSY $GITHUB_REF_NAME"
          --notes-file packaging/notes-de-version.md
