name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Installer
        run: python -m pip install -e ".[test]"
      - name: Écran virtuel pour les tests de l'interface
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -q xvfb
      - name: Tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q
      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -q
